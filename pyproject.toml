[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migrations", "legacy", "food-recognition-cnn"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101",   # assert trong test
  "S311",   # random không dùng cho mật mã
  "B008",
  "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S", "E501"]
"training/*" = ["S", "E401", "E501", "E702", "E703", "E741", "I001"]
