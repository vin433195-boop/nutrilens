<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f3f0e7;font-family:Arial,Helvetica,sans-serif;color:#1b2420">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f0e7;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden">
        <tr><td style="background:#1f7a4d;padding:22px 28px;color:#ffffff;font-size:20px;font-weight:bold">🥗 {{ site_name }}</td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:18px 28px;background:#faf8f3;color:#66746d;font-size:12px;line-height:1.5">
          Bạn nhận được email này vì có yêu cầu từ tài khoản {{ site_name }} gắn với địa chỉ email của bạn.
          Nếu không phải bạn, hãy bỏ qua email này.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
